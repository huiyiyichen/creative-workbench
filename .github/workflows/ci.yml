# =============================================================================
# CI：类型检查、前端单测与 ESLint、后端 pytest（PostgreSQL 服务容器）、ruff、分层、安全扫描。
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main, "refactor/**"]
  workflow_dispatch:

jobs:

  # ── Frontend type check ──
  frontend-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit

  # ── Frontend unit tests + coverage gate ──
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Test with coverage
        run: npm run test:coverage

  # ── Frontend ESLint（error 阻断，warning 只提示）──
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: ESLint
        run: npx eslint . --quiet

  # ── Backend pytest（全量，PostgreSQL 17 服务容器）──
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: local-dev-password
          POSTGRES_DB: creative_workbench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://workbench:local-dev-password@localhost:5432/creative_workbench_test
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install uv==0.11.21
          uv sync --frozen
      - name: Pytest
        run: uv run python -m pytest -q -p no:cacheprovider

  # ── Lint: ruff（针对本次改动的 Python 文件做阻断式检查）──
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Compute changed Python files
        id: diff
        working-directory: .
        run: |
          BASE=$(git rev-parse HEAD^)
          FILES=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'backend/*.py' \
                  | sed 's|^backend/||' | grep '\.py$' || true)
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changed Python files:"
          echo "$FILES"
      - name: Ruff check (changed files)
        if: steps.diff.outputs.files != ''
        run: echo "${{ steps.diff.outputs.files }}" | xargs ruff check
      - name: Ruff format check (changed files)
        if: steps.diff.outputs.files != ''
        run: echo "${{ steps.diff.outputs.files }}" | xargs ruff format --check

  # ── 分层纪律 ──
  backend-layering:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check API layering
        run: python scripts/check_layering.py

  # ── 依赖安全扫描 ──
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Backend pip-audit
        id: backend_audit
        continue-on-error: true
        working-directory: backend
        run: |
          pip install uv==0.11.21
          uv sync --frozen
          uv run pip-audit
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend npm audit
        id: frontend_audit
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci
          # 只审运行时依赖：braces（eslint-config-next 的传递依赖）全版本都有公告且无修复版，属开发工具链
          npm audit --omit=dev --audit-level=high
      - name: Enforce security audit results
        if: always()
        env:
          BACKEND_AUDIT_OUTCOME: ${{ steps.backend_audit.outcome }}
          FRONTEND_AUDIT_OUTCOME: ${{ steps.frontend_audit.outcome }}
        run: |
          echo "Backend audit: $BACKEND_AUDIT_OUTCOME"
          echo "Frontend audit: $FRONTEND_AUDIT_OUTCOME"
          if [ "$BACKEND_AUDIT_OUTCOME" != "success" ] || [ "$FRONTEND_AUDIT_OUTCOME" != "success" ]; then
            exit 1
          fi
