<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向 A 调色台 · 创意工作台样张</title>
<style>
:root {
  --base: #15181d;
  --panel: #1a1e25;
  --raise: #222731;
  --grat: #262c36;
  --line: #333b48;
  --text: #e8eaed;
  --dim: #8d96a3;
  --faint: #5e6774;
  --yl: #e3cc4b;
  --mg: #df5bd5;
  --bl: #6f8bff;
  --cy: #4fd2e2;
  --gr: #6ccf68;
  --rd: #ff6159;
  --wh: #f4f5f7;
  --sans: "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
  --num: "Bahnschrift", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--base);
  color: var(--text);
  font: 400 14px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cy); outline-offset: 2px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }

/* shell */
.shell { display: grid; grid-template-columns: 84px 1fr; min-height: 100vh; }
.nav {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 18px 0; border-right: 1px solid var(--grat); background: #12151a;
}
.mark { width: 36px; height: 36px; margin-bottom: 18px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-top: 1px solid var(--grat); }
.nav-group:first-of-type { border-top: 0; }
.nav button {
  width: 64px; padding: 8px 0 6px; border: 0; border-radius: 8px; background: none;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--dim); font-size: 12px;
}
.nav button svg { width: 20px; height: 20px; }
.nav button:hover { color: var(--text); background: var(--panel); }
.nav button[aria-current="page"] { color: var(--wh); background: var(--raise); }
.nav .spacer { flex: 1; }

main { min-width: 0; padding: 22px 28px 40px; }
.topbar { display: flex; align-items: baseline; gap: 18px; margin-bottom: 18px; }
.topbar h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: .02em; }
.topbar .date { color: var(--dim); font-size: 16px; }
.topbar .grow { flex: 1; }
.search {
  display: flex; align-items: center; gap: 8px; width: 300px; height: 36px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--faint);
}
.search kbd { margin-left: auto; font: 12px var(--num); color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.health { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; }
.health i { width: 8px; height: 8px; border-radius: 50%; background: var(--gr); box-shadow: 0 0 10px var(--gr); }

/* timeline */
.timeline {
  position: relative; border: 1px solid var(--grat); border-radius: 12px; overflow: hidden;
  background:
    radial-gradient(120% 140% at 85% -20%, rgba(111,139,255,.10), transparent 55%),
    linear-gradient(180deg, #181c22, #14171c);
}
.tl-head { display: flex; align-items: center; gap: 18px; padding: 14px 18px 10px; }
.tl-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--dim); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { width: 10px; height: 10px; border-radius: 2px; }
.seg { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: #12151a; }
.seg button { border: 0; background: none; padding: 3px 12px; border-radius: 6px; color: var(--dim); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--text); }
.tl-body { position: relative; padding: 0 18px 16px; overflow-x: auto; }
.tl-grid { position: relative; min-width: 860px; }
.ruler { display: grid; grid-template-columns: 72px 1fr; height: 22px; }
.ruler-scale { position: relative; }
.ruler-scale span { position: absolute; top: 2px; transform: translateX(-50%); font: 11px var(--num); color: var(--faint); }
.track { display: grid; grid-template-columns: 72px 1fr; height: 30px; align-items: center; }
.track-name { color: var(--dim); font-size: 12px; }
.lane { position: relative; height: 22px; border-radius: 4px; background: rgba(255,255,255,.015); }
.hours { position: absolute; inset: 22px 0 0 72px; pointer-events: none; }
.hours i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--grat); }
.clip {
  position: absolute; top: 3px; height: 16px; min-width: 6px; border: 0; padding: 0;
  border-radius: 3px; background: var(--c); opacity: .14; transition: opacity .25s, transform .15s;
}
.clip.lit { opacity: var(--o, .75); }
.clip:hover, .clip:focus-visible { opacity: 1; transform: scaleY(1.25); z-index: 2; }
.clip.sel { outline: 2px solid var(--wh); outline-offset: 1px; opacity: 1; }
.playhead { position: absolute; top: 0; bottom: -4px; width: 0; left: 72px; pointer-events: none; }
.playhead::before { content: ""; position: absolute; top: 18px; bottom: 0; left: 0; width: 1px; background: var(--rd); box-shadow: 0 0 8px var(--rd); }
.playhead span {
  position: absolute; top: 0; left: 0; transform: translateX(-50%);
  padding: 0 6px; border-radius: 3px; background: var(--rd); color: #1a0b0a; font: 600 11px/18px var(--num);
}
.tip {
  position: fixed; z-index: 30; max-width: 320px; padding: 8px 10px; border-radius: 8px; pointer-events: none;
  background: #0f1216; border: 1px solid var(--line); box-shadow: 0 8px 30px rgba(0,0,0,.5); font-size: 13px;
  opacity: 0; transition: opacity .12s;
}
.tip.show { opacity: 1; }
.tip small { display: block; color: var(--dim); font-size: 12px; }

/* lower grid */
.lower { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; margin-top: 20px; }
.feed-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.feed-head h2 { margin: 0 8px 0 0; font-size: 16px; font-weight: 600; }
.feed-head .grow { flex: 1; }
.sort { border: 0; background: none; color: var(--dim); font-size: 13px; }
.feed { list-style: none; margin: 0; padding: 0; }
.item {
  display: grid; grid-template-columns: 136px minmax(0, 1fr) 168px auto; gap: 16px; align-items: center;
  padding: 12px 10px; border-bottom: 1px solid var(--grat); border-radius: 10px;
}
.item:hover { background: rgba(255,255,255,.02); }
.item.sel { background: var(--panel); box-shadow: inset 3px 0 0 var(--c); }
.cover { position: relative; width: 136px; height: 76px; border-radius: 6px; overflow: hidden; background: #0f1216; }
.cover svg { display: block; width: 100%; height: 100%; }
.cover .dur { position: absolute; right: 5px; bottom: 4px; font: 600 11px var(--num); color: var(--wh); background: rgba(0,0,0,.55); padding: 0 4px; border-radius: 3px; }
.cover .typeword { position: absolute; left: 8px; top: 6px; font-size: 11px; color: var(--c); }
.it-main { min-width: 0; }
.it-title { margin: 0 0 4px; font-size: 15px; font-weight: 600; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.it-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--dim); font-size: 12px; }
.it-meta .plat { color: var(--c); }
.scope { display: grid; grid-template-columns: 1fr; gap: 2px; }
.scope .wave { display: flex; align-items: flex-end; gap: 2px; height: 26px; }
.scope .wave i { flex: 1; min-width: 3px; border-radius: 1px; background: var(--c); opacity: .35; }
.scope .wave i:last-child { opacity: 1; box-shadow: 0 0 8px var(--c); }
.scope .val { display: flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--dim); }
.scope .val b { font: 600 15px var(--num); color: var(--text); }
.scope .val em { font-style: normal; font-family: var(--num); color: var(--gr); }
.scope .none { height: 26px; display: flex; align-items: center; color: var(--faint); font-size: 12px; border: 1px dashed var(--line); border-radius: 4px; padding: 0 8px; }
.acts { display: flex; gap: 6px; }
.btn {
  height: 30px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 13px; white-space: nowrap;
}
.btn:hover { border-color: var(--dim); }
.btn.primary { border-color: transparent; background: var(--wh); color: #14171c; font-weight: 600; }
.btn.icon { width: 30px; padding: 0; display: inline-grid; place-items: center; }
.btn.icon svg { width: 16px; height: 16px; }

.rail { display: flex; flex-direction: column; gap: 16px; }
.card { border: 1px solid var(--grat); border-radius: 12px; background: var(--panel); padding: 14px 16px; }
.card h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card h3 .grow { flex: 1; }
.card h3 small { color: var(--faint); font-weight: 400; font-size: 12px; }
.watch-term { font-size: 20px; font-weight: 700; margin: 0 0 2px; }
.watch-sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
.dots { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; margin-bottom: 4px; }
.dots i { aspect-ratio: 1; border-radius: 50%; background: var(--grat); }
.dots i.on { background: var(--mg); box-shadow: 0 0 6px rgba(223,91,213,.6); }
.dots-axis { display: flex; justify-content: space-between; font: 10px var(--num); color: var(--faint); margin-bottom: 12px; }
.plat-bars { display: grid; gap: 6px; }
.plat-bars div { display: grid; grid-template-columns: 56px 1fr 32px; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
.plat-bars s { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--mg), rgba(223,91,213,.25)); text-decoration: none; }
.plat-bars b { font: 600 12px var(--num); color: var(--text); text-align: right; }
.watch-other { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--line); background: none; color: var(--dim); font-size: 12px; }
.chip.add { border-style: dashed; }
.res { width: 100%; border-collapse: collapse; font-size: 12px; }
.res th { font-weight: 400; color: var(--faint); padding: 0 0 6px; text-align: center; }
.res th:first-child { text-align: left; }
.res td { padding: 5px 0; text-align: center; border-top: 1px solid var(--grat); }
.res td:first-child { text-align: left; color: var(--text); }
.res .d { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--grat); }
.res .d.on { background: var(--rd); box-shadow: 0 0 6px var(--rd); }
.src-health { display: flex; gap: 10px; align-items: center; color: var(--dim); font-size: 13px; }
.src-health b { font: 600 18px var(--num); color: var(--text); }
.src-health .warn b { color: var(--yl); }

/* graph view */
.view[hidden] { display: none !important; }
.graph-wrap { position: relative; height: calc(100vh - 100px); min-height: 520px; border: 1px solid var(--grat); border-radius: 12px; overflow: hidden;
  background:
    radial-gradient(60% 60% at 50% 50%, rgba(111,139,255,.07), transparent 70%),
    repeating-linear-gradient(0deg, transparent 0 47px, rgba(255,255,255,.025) 47px 48px),
    repeating-linear-gradient(90deg, transparent 0 47px, rgba(255,255,255,.025) 47px 48px),
    #12151a;
}
#graph { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
#graph.dragging { cursor: grabbing; }
.g-tools { position: absolute; left: 16px; top: 16px; width: 240px; display: flex; flex-direction: column; gap: 10px; }
.g-tools .search { width: 100%; }
.g-types { display: flex; flex-wrap: wrap; gap: 6px; }
.g-types button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--line); background: rgba(18,21,26,.8); color: var(--text); font-size: 12px; }
.g-types button b { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }
.g-types button[aria-pressed="false"] { color: var(--faint); }
.g-types button[aria-pressed="false"] b { background: var(--faint); box-shadow: none; }
.g-stats { position: absolute; left: 16px; bottom: 14px; color: var(--faint); font-size: 12px; }
.g-stats b { font: 600 13px var(--num); color: var(--dim); }
.drawer {
  position: absolute; right: 16px; top: 16px; bottom: 16px; width: 340px; display: flex; flex-direction: column; gap: 12px;
  padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: rgba(22,25,31,.94); backdrop-filter: blur(8px);
  transform: translateX(calc(100% + 24px)); transition: transform .28s ease;
}
.drawer.open { transform: none; }
.drawer .cover { width: 100%; height: 150px; }
.drawer h3 { margin: 0; font-size: 17px; line-height: 1.45; }
.drawer .it-meta { font-size: 12px; }
.drawer p { margin: 0; color: var(--dim); font-size: 13px; }
.drawer h4 { margin: 4px 0 0; font-size: 12px; font-weight: 400; color: var(--faint); }
.rel { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
.rel li { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 6px 4px; border-radius: 6px; font-size: 13px; }
.rel li:hover { background: var(--raise); }
.rel li b { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.rel li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rel li small { color: var(--faint); font-size: 11px; }
.drawer .acts { justify-content: flex-start; }
.drawer .close { position: absolute; right: 10px; top: 10px; }
.foot { margin-top: 26px; color: var(--faint); font-size: 12px; }

@media (max-width: 1180px) {
  .lower { grid-template-columns: 1fr; }
  .rail { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .item { grid-template-columns: 112px minmax(0, 1fr) 140px; }
  .item .acts { grid-column: 2 / -1; }
  .cover { width: 112px; height: 63px; }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .nav { position: sticky; z-index: 20; height: auto; flex-direction: row; justify-content: space-between; padding: 6px 8px; border-right: 0; border-bottom: 1px solid var(--grat); overflow-x: auto; }
  .nav .mark, .nav .spacer { display: none; }
  .nav-group { flex-direction: row; border-top: 0; padding: 0; }
  .nav button { width: 52px; }
  main { padding: 16px 14px 30px; }
  .topbar { flex-wrap: wrap; }
  .search { width: 100%; }
  .item { grid-template-columns: 96px minmax(0, 1fr); }
  .cover { width: 96px; height: 54px; }
  .scope, .item .acts { grid-column: 1 / -1; }
  .drawer { width: auto; left: 16px; }
  .g-tools { width: auto; right: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="主导航">
    <svg class="mark" viewBox="0 0 36 36" aria-hidden="true">
      <circle cx="18" cy="18" r="16" fill="none" stroke="#333b48"/>
      <circle cx="18" cy="5" r="2.4" fill="var(--rd)"/><circle cx="29.3" cy="11.5" r="2.4" fill="var(--mg)"/>
      <circle cx="29.3" cy="24.5" r="2.4" fill="var(--bl)"/><circle cx="18" cy="31" r="2.4" fill="var(--cy)"/>
      <circle cx="6.7" cy="24.5" r="2.4" fill="var(--gr)"/><circle cx="6.7" cy="11.5" r="2.4" fill="var(--yl)"/>
      <circle cx="18" cy="18" r="3" fill="var(--wh)"/>
    </svg>
    <div class="nav-group">
      <button data-view="discover" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>今日</button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3c3 4 5 6 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-5 0 2 1 3 2 3 0-3 0-5 1-8z"/></svg>热点</button>
    </div>
    <div class="nav-group">
      <button data-view="graph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="17" r="3"/><path d="M8 8.5l3 6M16.5 7.5L13.5 14.5M8.5 7l7.5-.8"/></svg>灵感库</button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 10v10"/></svg>模板库</button>
    </div>
    <div class="nav-group">
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg>项目</button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg>作品</button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h10M4 18h6"/><circle cx="18" cy="17" r="3"/></svg>任务</button>
    </div>
    <div class="spacer"></div>
    <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>设置</button>
  </nav>

  <main>
    <section class="view" id="view-discover" aria-label="今日">
      <header class="topbar">
        <h1>今日</h1>
        <span class="date num">10 月 16 日 周五</span>
        <span class="grow"></span>
        <span class="health"><i></i>23 个信源正常，2 个已过期</span>
        <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>搜索选题、收藏、项目<kbd>Ctrl K</kbd></label>
      </header>

      <section class="timeline" aria-label="今天的信号时间线">
        <div class="tl-head">
          <h2>今天的信号</h2>
          <div class="legend" id="legend"></div>
          <span style="flex:1"></span>
          <div class="seg" role="group" aria-label="时间范围">
            <button aria-pressed="true">今天</button><button aria-pressed="false">48 小时</button><button aria-pressed="false">7 天</button>
          </div>
        </div>
        <div class="tl-body">
          <div class="tl-grid" id="tlgrid">
            <div class="ruler"><span></span><div class="ruler-scale" id="ruler"></div></div>
            <div id="tracks"></div>
            <div class="hours" id="hours"></div>
            <div class="playhead" id="playhead"><span class="num" id="phlabel">00:00</span></div>
          </div>
        </div>
      </section>

      <div class="lower">
        <section aria-label="信号流">
          <div class="feed-head">
            <h2>信号流</h2>
            <div class="seg" role="group" aria-label="形态" id="typeseg"></div>
            <span class="grow"></span>
            <button class="sort">按热度变化排序</button>
          </div>
          <ul class="feed" id="feed"></ul>
        </section>

        <aside class="rail" aria-label="追踪与共振">
          <section class="card">
            <h3>追踪词<span class="grow"></span><small>近 24 小时</small></h3>
            <p class="watch-term">Opus 5.5 视频</p>
            <div class="watch-sub">5 个平台共 <span class="num">120</span> 条，首次出现在 3 天前</div>
            <div class="dots" id="dots"></div>
            <div class="dots-axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>现在</span></div>
            <div class="plat-bars" id="platbars"></div>
            <div class="watch-other">
              <button class="chip">Remotion</button><button class="chip">AI MV</button><button class="chip">动画讲解</button><button class="chip add">添加追踪词</button>
            </div>
          </section>
          <section class="card">
            <h3>跨平台共振<span class="grow"></span><small>出现的平台</small></h3>
            <table class="res" id="res"></table>
          </section>
          <section class="card">
            <h3>采集</h3>
            <div class="src-health">
              <span><b>23</b> 正常</span><span class="warn"><b>2</b> 已过期</span><span style="flex:1"></span><button class="btn">查看信源</button>
            </div>
          </section>
        </aside>
      </div>
      <p class="foot">样张，数据为示例。</p>
    </section>

    <section class="view" id="view-graph" aria-label="灵感库图谱" hidden>
      <header class="topbar">
        <h1>灵感库</h1>
        <div class="seg" role="group" aria-label="视图"><button aria-pressed="true">图谱</button><button aria-pressed="false">列表</button><button aria-pressed="false">画廊</button></div>
        <span class="grow"></span>
        <span class="health"><i></i>Obsidian 已同步，2 分钟前</span>
        <button class="btn primary">添加收藏</button>
      </header>
      <div class="graph-wrap">

let G = null;
function buildGraph() {
  const r = rand(7), nodes = [], links = [];
  HUBS.forEach(([title, desc], k) => nodes.push({ id: 'h' + k, type: 'topic', title, desc, hub: true }));
  NAMED.forEach(([type, title, hubs], k) => { nodes.push({ id: 'n' + k, type, title, desc: '' }); hubs.forEach(h => links.push(['n' + k, 'h' + h])); });
  const pools = { video: ['混剪', '教程', '实测', '复盘', '片段'], article: ['评论', '报道', '解读', '论文'], post: ['笔记', '清单', '模板'], prompt: ['提示词'], repo: ['工具'], note: ['笔记'] };
  const keys = Object.keys(pools);
  for (let k = 0; k < 110; k++) {
    const type = keys[Math.floor(r() * r() * keys.length * 1.6) % keys.length];
    const hub = Math.floor(Math.pow(r(), 1.6) * HUBS.length);
    const id = 'x' + k;
    nodes.push({ id, type, title: `${HUBS[hub][0]} ${pools[type][k % pools[type].length]} ${k + 1}`, desc: '' });
    links.push([id, 'h' + hub]);
    if (r() < .28) links.push([id, 'x' + Math.floor(r() * k) || 'n0']);
    if (r() < .12) links.push([id, 'h' + Math.floor(r() * HUBS.length)]);
  }
  links.push(['h0', 'h1'], ['h0', 'h4'], ['h2', 'h3'], ['h4', 'h5'], ['h1', 'h5']);
  const byId = new Map(nodes.map(n => [n.id, n]));
  const L = links.map(([a, b]) => ({ a: byId.get(a), b: byId.get(b) })).filter(l => l.a && l.b && l.a !== l.b);
  nodes.forEach(n => { n.deg = 0; n.nb = new Set(); });
  L.forEach(l => { l.a.deg++; l.b.deg++; l.a.nb.add(l.b); l.b.nb.add(l.a); });
  nodes.forEach((n, i) => {
    const a = i * 2.399, d = 40 + Math.sqrt(i) * 26;
    n.x = Math.cos(a) * d; n.y = Math.sin(a) * d; n.vx = 0; n.vy = 0;
    n.r = n.hub ? 9 + Math.sqrt(n.deg) * 2.6 : n.type === 'project' ? 7 : 3 + Math.min(5, Math.sqrt(n.deg) * 1.4);
  });
  return { nodes, links: L, on: new Set(Object.keys(GT)), sel: null, hover: null, k: 1, ox: 0, oy: 0, alpha: 1 };
}

  const N = G.nodes, a = G.alpha;
  for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
    const p = N[i], q = N[j]; let dx = q.x - p.x, dy = q.y - p.y, d2 = dx * dx + dy * dy + .01;
    if (d2 > 90000) continue;
    const f = (p.hub || q.hub ? 1400 : 520) / d2 * a, d = Math.sqrt(d2);
    dx /= d; dy /= d; p.vx -= dx * f; p.vy -= dy * f; q.vx += dx * f; q.vy += dy * f;
  }
  G.links.forEach(({ a: p, b: q }) => {
    const dx = q.x - p.x, dy = q.y - p.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    const rest = p.hub && q.hub ? 210 : p.hub || q.hub ? 54 + q.r + p.r : 40;
    const f = (d - rest) * .02 * a; p.vx += dx / d * f; p.vy += dy / d * f; q.vx -= dx / d * f; q.vy -= dy / d * f;
  });
  N.forEach(n => { if (n.fixed) return; n.vx -= n.x * .0016 * a; n.vy -= n.y * .0016 * a; n.vx *= .82; n.vy *= .82; n.x += n.vx; n.y += n.vy; });
  G.alpha = Math.max(.02, G.alpha * .992);
}
function visible(n) { return G.on.has(n.type); }
function draw() {
  const w = cv.clientWidth, h = cv.clientHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.save(); ctx.translate(w / 2 + G.ox, h / 2 + G.oy); ctx.scale(G.k, G.k);
  const focus = G.hover || G.sel;
  ctx.lineWidth = 1 / G.k;
  G.links.forEach(({ a, b }) => {
    if (!visible(a) || !visible(b)) return;
    const hot = focus && (a === focus || b === focus);
    ctx.strokeStyle = hot ? 'rgba(244,245,247,.55)' : focus ? 'rgba(120,135,160,.06)' : 'rgba(120,135,160,.16)';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  });
  G.nodes.forEach(n => {
    if (!visible(n)) return;
    const dim = focus && n !== focus && !focus.nb.has(n);
    ctx.globalAlpha = dim ? .18 : 1;
    ctx.shadowColor = GT[n.type].hex; ctx.shadowBlur = n.hub ? 22 : 8;
    ctx.fillStyle = GT[n.type].hex;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill();
    if (n.type === 'project') { ctx.shadowBlur = 0; ctx.strokeStyle = '#15181d'; ctx.lineWidth = 2 / G.k; ctx.beginPath(); ctx.arc(n.x, n.y, n.r * .45, 0, Math.PI * 2); ctx.stroke(); }
    ctx.shadowBlur = 0;
    if (n === G.sel) { ctx.strokeStyle = '#f4f5f7'; ctx.lineWidth = 1.5 / G.k; ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 5, 0, Math.PI * 2); ctx.stroke(); }
    if ((n.hub || n === focus || (focus && focus.nb.has(n) && G.k > .8)) && !dim) {
      ctx.fillStyle = n.hub ? '#e8eaed' : '#c4cad3';
      ctx.font = `${n.hub ? 600 : 400} ${(n.hub ? 13 : 11) / Math.max(.8, G.k)}px "Noto Sans SC", sans-serif`;
      ctx.textAlign = 'center'; ctx.fillText(n.title.length > 18 ? n.title.slice(0, 18) + '…' : n.title, n.x, n.y + n.r + 14 / G.k);
    }
  });
  ctx.globalAlpha = 1; ctx.restore();
}
let running = false;
function loop() { if (!running) return; tick(); draw(); requestAnimationFrame(loop); }
function startGraph() {
  if (!G) {
    G = buildGraph(); resize();
    if (reduce) for (let i = 0; i < 500; i++) tick();
    const gt = document.getElementById('gtypes');
    gt.innerHTML = Object.entries(GT).map(([k, t]) => `<button data-k="${k}" aria-pressed="true" style="--c:${t.hex}"><b></b>${t.name}</button>`).join('');
    gt.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const on = b.getAttribute('aria-pressed') === 'true';
      b.setAttribute('aria-pressed', !on); on ? G.on.delete(b.dataset.k) : G.on.add(b.dataset.k); draw(); });
    document.getElementById('gstats').innerHTML = `<b>${G.nodes.length}</b> 个条目，<b>${G.links.length}</b> 条关联`;
    bindGraph();
  } else resize();
  if (!running) { running = true; loop(); }
}
function toWorld(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - r.width / 2 - G.ox) / G.k, y: (e.clientY - r.top - r.height / 2 - G.oy) / G.k }; }
function hit(p) { let best = null, bd = 1e9; G.nodes.forEach(n => { if (!visible(n)) return; const d = Math.hypot(n.x - p.x, n.y - p.y); if (d < n.r + 6 / G.k && d < bd) { bd = d; best = n; } }); return best; }
function bindGraph() {
  let drag = null, pan = null, moved = false;
  cv.addEventListener('pointerdown', e => { const n = hit(toWorld(e)); moved = false; cv.setPointerCapture(e.pointerId); cv.classList.add('dragging');
    if (n) { drag = n; n.fixed = true; } else pan = { x: e.clientX - G.ox, y: e.clientY - G.oy }; });
  cv.addEventListener('pointermove', e => {
    if (drag) { const p = toWorld(e); drag.x = p.x; drag.y = p.y; G.alpha = Math.max(G.alpha, .3); moved = true; return; }
    if (pan) { G.ox = e.clientX - pan.x; G.oy = e.clientY - pan.y; moved = true; draw(); return; }
    const n = hit(toWorld(e)); if (n !== G.hover) { G.hover = n; cv.style.cursor = n ? 'pointer' : 'grab'; draw(); }
  });
  cv.addEventListener('pointerup', e => { cv.classList.remove('dragging'); if (drag) drag.fixed = false;
    if (!moved) { const n = hit(toWorld(e)); n ? openDrawer(n) : closeDrawer(); } drag = null; pan = null; });
  cv.addEventListener('wheel', e => { e.preventDefault(); G.k = Math.min(3, Math.max(.35, G.k * (e.deltaY < 0 ? 1.1 : .9))); draw(); }, { passive: false });
  addEventListener('resize', () => { if (!document.getElementById('view-graph').hidden) { resize(); draw(); } });
  document.getElementById('dclose').addEventListener('click', closeDrawer);
}
function openDrawer(n) {
  G.sel = n; draw();
  const t = GT[n.type];
  document.getElementById('dcover').innerHTML = scopeCover(hash(n.title), t.hex, n.type);
  document.getElementById('dtitle').textContent = n.title;
  document.getElementById('dmeta').innerHTML = `<span class="plat" style="--c:${t.hex}">${t.name}</span><span>${n.deg} 条关联</span>`;
  document.getElementById('ddesc').textContent = n.desc || (n.type === 'note' ? '来自 Obsidian 的笔记，修改会同步回工作台。' : '收藏于 10 月 14 日。');
  const rel = [...n.nb].sort((a, b) => b.deg - a.deg).slice(0, 12);
  document.getElementById('drelh').textContent = `关联 ${n.nb.size}`;
  document.getElementById('drel').innerHTML = rel.map(m => `<li data-id="${m.id}" style="--c:${GT[m.type].hex}"><b></b><span>${m.title}</span><small>${GT[m.type].name}</small></li>`).join('');
  document.getElementById('drawer').classList.add('open');
}
document.getElementById('drel').addEventListener('click', e => { const li = e.target.closest('li'); if (li) openDrawer(G.nodes.find(n => n.id === li.dataset.id)); });
function closeDrawer() { if (G) { G.sel = null; draw(); } document.getElementById('drawer').classList.remove('open'); }

renderFeed();
requestAnimationFrame(sweep);
if (location.hash === '#graph') document.querySelector('.nav [data-view="graph"]').click();
</script>
